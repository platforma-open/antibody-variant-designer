name: Python Tests

on:
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'
  push:
    branches:
      - 'main'
  workflow_dispatch: {}

env:
  UV_VERSION: "0.11.16"

jobs:
  ruff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [developability, antifold]
    defaults:
      run:
        working-directory: software/${{ matrix.package }}/software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: software/${{ matrix.package }}/software/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run --group dev ruff check .

  pytest:
    # Only developability. The antifold wrapper keeps pytest in its `e2e` group
    # rather than `dev`, because its one test file needs the `antifold` extra —
    # torch and its closure, about 2 GiB — and skips without it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/developability/software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: software/developability/software/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run --group dev pytest

  requirements-sync:
    # src/requirements.txt is generated from pyproject.toml (the single source of
    # truth) and is what pl-pkg builds from. This job fails if the committed file
    # has drifted from pyproject — e.g. someone changed a dependency but forgot to
    # regenerate. Fix locally with `pnpm deps:export` (see the package's package.json).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [developability, antifold]
    defaults:
      run:
        working-directory: software/${{ matrix.package }}/software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: software/${{ matrix.package }}/software/uv.lock

      - name: Regenerate requirements.txt from pyproject.toml
        # Same script `pnpm deps:export` runs locally — single source of truth.
        run: bash scripts/deps-export.sh

      - name: Verify requirements.txt is in sync with pyproject.toml
        run: |
          if ! git diff --exit-code -- src/requirements.txt; then
            echo ""
            echo "::error::software/${{ matrix.package }}/software/src/requirements.txt is out of sync with pyproject.toml"
            echo "Dependencies are defined in pyproject.toml; src/requirements.txt is generated."
            echo "Resolve locally with:"
            echo "    cd software/${{ matrix.package }}/software && pnpm deps:export"
            echo "then commit the updated src/requirements.txt."
            exit 1
          fi
          echo "src/requirements.txt is in sync with pyproject.toml."
