[project]
name = "antibody-variant-designer"
version = "0.1.0"
description = "Antibody Variant Designer software: residue indexing, liability scan and triage, AntiFold tolerance read, candidate generation, and ranking."
requires-python = ">=3.12"
dependencies = [
    "freesasa==2.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party source (BSD 3-Clause, commit 789d467) — ours to run,
# not ours to restyle.
extend-exclude = ["developability/vendor"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return
    "PTH",  # use pathlib
    "ARG",  # unused arguments
    "RUF",
]
ignore = [
    # Greek letters and math signs in docstrings are intended scientific notation.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # pytest fixtures arrive as unused-looking arguments

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["developability", "tests"]
markers = [
    "e2e: end-to-end CLI chain tests that need a real AntiFold checkpoint",
]
